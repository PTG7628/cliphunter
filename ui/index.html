<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipHunter Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B5CF6'/%3E%3Cstop offset='1' stop-color='%2300E5FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='url(%23g)'/%3E%3Ccircle cx='12' cy='12' r='6' fill='none' stroke='%230B0B14' stroke-width='2.4'/%3E%3Ccircle cx='12' cy='12' r='1.6' fill='%230B0B14'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/ui/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></div>
      <div><b>ClipHunter</b><span>Highlight studio</span></div>
    </div>
    <button class="btn primary create-btn" id="createBtn" title="Create clips (N)"><span data-icon="plus"></span><span class="label">Create clips</span></button>
    <nav class="nav" id="nav">
      <a href="#/" data-route="home"><span data-icon="home"></span><span class="label">Home</span></a>
      <a href="#/projects" data-route="projects"><span data-icon="folder"></span><span class="label">Projects</span><span class="count hidden" id="navActive"></span></a>
      <a href="#/highlights" data-route="highlights"><span data-icon="sparkles"></span><span class="label">Highlights</span><span class="count hot hidden" id="navTop"></span></a>
      <a href="#/editor" data-route="editor"><span data-icon="scissors"></span><span class="label">Editor</span></a>
      <a href="#/live" data-route="live"><span data-icon="radio"></span><span class="label">Live channels</span><span class="count hidden" id="navLive"></span></a>
      <a href="#/results" data-route="results"><span data-icon="chart"></span><span class="label">Results</span></a>
      <a href="#/settings" data-route="settings"><span data-icon="settings"></span><span class="label">Settings</span></a>
    </nav>
    <div class="side-foot" id="sideFoot">
      <div class="row"><span class="dot" id="jobDot"></span><span class="ellipsis" id="jobText">Connecting…</span></div>
      <div class="row"><span class="dot" id="aiDot"></span><span class="ellipsis" id="aiText">AI</span></div>
      <div class="row"><span class="dot" id="visDot"></span><span class="ellipsis" id="visText">Vision</span></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar" id="topbar"></header>
    <div id="page"></div>
  </main>
</div>
<div class="dragcover" id="dragcover"><div><span data-icon="upload"></span><br>Drop your video to find highlights</div></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>
<script src="/ui/app.js"></script>
<script src="/ui/pages.js"></script>
</body>
</html>
